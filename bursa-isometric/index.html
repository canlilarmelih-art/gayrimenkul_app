<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Isometric Bursa</title>
<style>
  :root { --bg:#cfd8c4; --ink:#f4efe6; --panel:rgba(20,20,22,.78); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink);
    -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; display:block; }
  canvas.drag { cursor:grabbing; }
  .title { position:fixed; top:max(12px, env(safe-area-inset-top)); left:16px; display:flex; gap:10px; align-items:center;
    text-shadow:0 1px 6px rgba(0,0,0,.55); font-family: Georgia, "Times New Roman", serif; font-size:22px; pointer-events:none; }
  .title .flag { width:28px; height:20px; border-radius:3px; background:#e30a17; display:inline-block; position:relative; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .title .flag::after { content:"☪"; position:absolute; inset:0; display:grid; place-items:center; font-size:12px; color:#fff; }
  .stat { position:fixed; top:calc(max(12px, env(safe-area-inset-top)) + 38px); left:16px; background:var(--panel);
    padding:6px 12px; border-radius:999px; font-size:13px; display:flex; align-items:center; gap:8px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#3ddc84; }
  .bar { position:fixed; left:12px; right:12px; bottom:max(12px, env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:center; }
  .bar input { flex:1; min-width:0; background:var(--panel); border:1px solid rgba(255,255,255,.12); color:var(--ink);
    border-radius:999px; padding:12px 16px; font-size:16px; outline:none; -webkit-user-select:text; user-select:text; }
  .bar button { background:var(--panel); border:1px solid rgba(255,255,255,.12); color:var(--ink); border-radius:999px;
    width:44px; height:44px; font-size:18px; cursor:pointer; }
  .results { position:fixed; left:12px; right:12px; bottom:calc(max(12px, env(safe-area-inset-bottom)) + 56px); background:var(--panel);
    border-radius:14px; overflow:hidden; display:none; max-height:40vh; overflow-y:auto; }
  .results div { padding:12px 16px; font-size:15px; border-bottom:1px solid rgba(255,255,255,.08); cursor:pointer; }
  .results div:last-child { border-bottom:0; }
  .results div:hover { background:rgba(255,255,255,.08); }
  .info { position:fixed; top:calc(max(12px, env(safe-area-inset-top)) + 80px); left:16px; background:var(--panel);
    padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.4; display:none; max-width:70vw; }
  .loading { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); color:#333; font-size:16px; z-index:5; }
  @media (max-width:520px){ .title{font-size:19px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><span class="flag"></span>isometric bursa</div>
<div class="stat"><span class="dot"></span><span id="stat">yükleniyor…</span></div>
<div class="info" id="info"></div>
<div class="results" id="results"></div>
<div class="bar">
  <input id="q" type="search" placeholder="Mahalle / cami / bina ara…" autocomplete="off">
  <button id="rot" title="Yönü çevir" aria-label="Yönü çevir">⟳</button>
  <button id="home" title="Başa dön" aria-label="Başa dön">⌂</button>
</div>
<div class="loading" id="loading">Bursa haritası yükleniyor…</div>

<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
let DATA = null, W = 0, H = 0, DPR = 1;
// kamera: ekran merkezinin dünya koordinatı, ölçek (piksel/metre), yön (0..3 → 90° adımlar)
const cam = { x: 0, y: 0, s: 0.5, dir: 0 };
let drawn = [];            // son karedeki çizilen binalar (tıklama için)
let selected = null;
const SIN = 0.5, COS = 0.866, VZ = 0.85;   // izometrik açı ve düşey ölçek

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  draw();
}
addEventListener("resize", resize);

// dünya (x doğu, y kuzey) → döndürülmüş dünya
function rot(x, y) {
  switch (cam.dir) { case 0: return [x, y]; case 1: return [y, -x]; case 2: return [-x, -y]; default: return [-y, x]; }
}
// dünya → ekran (z: yükseklik metre)
function proj(x, y, z) {
  const [rx, ry] = rot(x, y), [cx, cy] = rot(cam.x, cam.y);
  const dx = rx - cx, dy = ry - cy;
  return [W / 2 + (dx + dy) * COS * cam.s, H / 2 + ((dx - dy) * SIN - z * VZ) * cam.s];
}

function hash(n) { n = Math.sin(n * 12.9898) * 43758.5453; return n - Math.floor(n); }
function shade(rgb, k) { return `rgb(${Math.round(rgb[0]*k)},${Math.round(rgb[1]*k)},${Math.round(rgb[2]*k)})`; }
const ROOFS = [[196,98,66],[184,84,58],[205,115,80],[170,76,52],[214,140,100]];

function poly(pts, fill, stroke, lw) {
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}
function line(pts, color, w) {
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[i][0], pts[i][1]);
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
}

function draw() {
  if (!DATA) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#cdd6bd"; ctx.fillRect(0, 0, W, H);
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  const P = (p, z = 0) => proj(p[0], p[1], z);

  for (const g of DATA.parks) poly(g.p.map(p => P(p)), "#a9c58d");
  for (const g of DATA.water) poly(g.p.map(p => P(p)), "#7fb4d6");

  // yollar: önce çerçeve, sonra dolgu; büyük yollar üstte
  const order = ["residential","unclassified","pedestrian","tertiary","secondary","primary","trunk","motorway"];
  const roads = DATA.roads.slice().sort((a, b) => order.indexOf(a.k) - order.indexOf(b.k));
  for (const r of roads) line(r.p.map(p => P(p)), "#b9b3a6", r.w * cam.s * 0.95 + 1.5);
  for (const r of roads) line(r.p.map(p => P(p)), r.k === "pedestrian" ? "#ece3d2" : "#f1ede4", r.w * cam.s * 0.95);

  // binalar: arkadan öne (ekran y'sine göre) boyama
  const list = DATA.buildings.map((b, i) => {
    const c = b.c || (b.c = [b.p.reduce((s, q) => s + q[0], 0) / b.p.length, b.p.reduce((s, q) => s + q[1], 0) / b.p.length]);
    return { b, i, d: proj(c[0], c[1], 0)[1] };
  }).sort((a, b) => a.d - b.d);

  drawn = [];
  for (const { b, i } of list) {
    const base = b.p.map(p => P(p, 0));
    // görünür alan dışını atla
    let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
    for (const q of base) { minx = Math.min(minx, q[0]); maxx = Math.max(maxx, q[0]); miny = Math.min(miny, q[1]); maxy = Math.max(maxy, q[1]); }
    if (maxx < -50 || minx > W + 50 || maxy < -50 || miny - b.h * VZ * cam.s > H + 50) continue;

    const tall = b.h > 25;
    const rgb = tall ? [196,200,206] : ROOFS[Math.floor(hash(i + 1) * ROOFS.length)];
    const wall = tall ? [226,228,232] : [236,226,208];
    const top = base.map((_, k) => P(b.p[k], b.h));

    // poligon yönü (dış normal için)
    let area = 0;
    for (let k = 0; k < b.p.length; k++) { const a = b.p[k], c = b.p[(k + 1) % b.p.length]; area += a[0] * c[1] - c[0] * a[1]; }
    const sgn = area > 0 ? 1 : -1;
    for (let k = 0; k < b.p.length; k++) {
      const a = b.p[k], c = b.p[(k + 1) % b.p.length];
      let nx = (c[1] - a[1]) * sgn, ny = -(c[0] - a[0]) * sgn;     // dış normal (dünya)
      const [rnx, rny] = rot(nx, ny);
      if (rnx - rny <= 0) continue;                                  // kameraya bakmıyor
      const len = Math.hypot(rnx, rny) || 1;
      const lit = 0.72 + 0.28 * Math.max(0, (-rnx + rny * 0.2) / len + 0.3);   // soldan ışık
      poly([base[k], base[(k + 1) % b.p.length], top[(k + 1) % b.p.length], top[k]], shade(wall, Math.min(1, lit)), "rgba(70,55,40,.35)", 0.6);
    }
    const sel = selected === b;
    poly(top, sel ? "#ffd54a" : shade(rgb, 0.96 + 0.06 * hash(i + 7)), "rgba(60,40,30,.45)", 0.7);
    drawn.push({ b, top });
  }
  $("stat").textContent = `${DATA.buildings.length.toLocaleString("tr")} bina · OSM`;
}

// ---- etkileşim ----
const ptrs = new Map(); let last = null, moved = 0, downAt = null;
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); cv.classList.add("drag"); moved = 0; downAt = [e.clientX, e.clientY]; last = pinchInfo(); });
cv.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) {
    const dx = e.clientX - prev[0], dy = e.clientY - prev[1]; moved += Math.abs(dx) + Math.abs(dy);
    panBy(dx, dy);
  } else if (ptrs.size === 2) {
    const n = pinchInfo(); if (last && last.d) zoomAt(n.cx, n.cy, n.d / last.d); last = n; moved += 10;
  }
  draw();
});
function end(e) { ptrs.delete(e.pointerId); cv.classList.remove("drag"); last = pinchInfo();
  if (ptrs.size === 0 && moved < 6 && downAt) pick(downAt[0], downAt[1]); }
cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
cv.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); draw(); }, { passive: false });
function pinchInfo() { if (ptrs.size < 2) return null; const [a, b] = [...ptrs.values()]; return { d: Math.hypot(a[0]-b[0], a[1]-b[1]), cx: (a[0]+b[0])/2, cy: (a[1]+b[1])/2 }; }

function screenToWorld(sx, sy) {
  // proj tersi (z=0)
  const [cx, cy] = rot(cam.x, cam.y);
  const u = (sx - W / 2) / (COS * cam.s), v = (sy - H / 2) / (SIN * cam.s);   // u = dx+dy, v = dx-dy
  const dx = (u + v) / 2, dy = (u - v) / 2;
  const rx = cx + dx, ry = cy + dy;
  switch (cam.dir) { case 0: return [rx, ry]; case 1: return [-ry, rx]; case 2: return [-rx, -ry]; default: return [ry, -rx]; }
}
function panBy(dx, dy) {
  const a = screenToWorld(W / 2, H / 2), b = screenToWorld(W / 2 - dx, H / 2 - dy);
  cam.x += b[0] - a[0]; cam.y += b[1] - a[1]; clampCam();
}
function zoomAt(sx, sy, k) {
  const before = screenToWorld(sx, sy);
  cam.s = Math.max(0.12, Math.min(6, cam.s * k));
  const after = screenToWorld(sx, sy);
  cam.x += before[0] - after[0]; cam.y += before[1] - after[1]; clampCam();
}
function clampCam() { const b = DATA.bounds; cam.x = Math.max(b[0], Math.min(b[2], cam.x)); cam.y = Math.max(b[1], Math.min(b[3], cam.y)); }

function inPoly(x, y, pts) { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
  if ((pts[i][1] > y) !== (pts[j][1] > y) && x < (pts[j][0] - pts[i][0]) * (y - pts[i][1]) / (pts[j][1] - pts[i][1]) + pts[i][0]) c = !c; } return c; }
function pick(x, y) {
  selected = null;
  for (let i = drawn.length - 1; i >= 0; i--) if (inPoly(x, y, drawn[i].top)) { selected = drawn[i].b; break; }
  const info = $("info");
  if (selected) { info.style.display = "block";
    info.innerHTML = `<b>${selected.n || "Bina"}</b><br>Yaklaşık yükseklik: ${selected.h} m${selected.k && selected.k !== "yes" ? `<br>Tür: ${selected.k}` : ""}`; }
  else info.style.display = "none";
  draw();
}

// ---- arama ----
$("q").addEventListener("input", e => {
  const t = e.target.value.trim().toLocaleLowerCase("tr"), box = $("results");
  if (t.length < 2) { box.style.display = "none"; return; }
  const hits = DATA.buildings.filter(b => b.n && b.n.toLocaleLowerCase("tr").includes(t)).slice(0, 8);
  box.innerHTML = ""; hits.forEach(b => { const d = document.createElement("div"); d.textContent = b.n; d.onclick = () => { flyTo(b); box.style.display = "none"; }; box.appendChild(d); });
  if (!hits.length) box.innerHTML = "<div>Sonuç yok</div>";
  box.style.display = "block";
});
function flyTo(b) { b.c = b.c || [b.p[0][0], b.p[0][1]]; cam.x = b.c[0]; cam.y = b.c[1]; cam.s = 1.6; selected = b;
  const info = $("info"); info.style.display = "block"; info.innerHTML = `<b>${b.n}</b><br>Yaklaşık yükseklik: ${b.h} m`; draw(); }
$("rot").onclick = () => { cam.dir = (cam.dir + 1) % 4; draw(); };
$("home").onclick = () => { initCam(); draw(); };

function densest() {   // en çok bina içeren 250 m'lik hücre → açılış noktası
  const cell = 250, m = new Map();
  for (const b of DATA.buildings) { const x = b.p[0][0], y = b.p[0][1], k = Math.floor(x / cell) + "," + Math.floor(y / cell);
    const e = m.get(k) || [0, 0, 0]; e[0]++; e[1] += x; e[2] += y; m.set(k, e); }
  let best = null; for (const e of m.values()) if (!best || e[0] > best[0]) best = e;
  return best ? [best[1] / best[0], best[2] / best[0]] : [0, 0];
}
function initCam() { const c = densest(); cam.x = c[0]; cam.y = c[1]; cam.s = 1.1; cam.dir = 0; selected = null; $("info").style.display = "none"; }

fetch("data/bursa.json").then(r => r.json()).then(d => { DATA = d; resize(); initCam(); draw(); $("loading").style.display = "none"; })
  .catch(() => { $("loading").textContent = "Veri yüklenemedi (data/bursa.json)."; });
</script>
</body>
</html>
